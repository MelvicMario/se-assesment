      --systemOrange: #FF9F0A;

    background: none;
    color: inherit;

const { useState, useEffect, useMemo, useRef } = React;

/* ─────────────── Helpers ─────────────── */
const LS = {
  get: (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set: (k, val) => localStorage.setItem(k, JSON.stringify(val)),
  del: (k) => localStorage.removeItem(k),
};

const fmtKm = (m) => (m / 1000).toFixed(1);
const fmtMin = (s) => {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}h ${m}m` : `${m}m`;
};
const fmtPace = (mps) => {
  if (!mps || mps <= 0) return "—";
  const sPerKm = 1000 / mps;
  const m = Math.floor(sPerKm / 60), s = Math.round(sPerKm % 60);
  return `${m}:${s.toString().padStart(2, "0")}`;
};
const fmtSpeed = (mps) => (mps * 3.6).toFixed(1);
const fmtDate = (iso) => new Date(iso).toLocaleDateString("es-ES",
  { day: "numeric", month: "short" });
const fmtDateLong = (iso) => {
  const d = new Date(iso);
  const today = new Date(); today.setHours(0,0,0,0);
  const yest = new Date(today); yest.setDate(yest.getDate() - 1);
  const d0 = new Date(d); d0.setHours(0,0,0,0);
  if (d0.getTime() === today.getTime()) return "Hoy · " + d.toLocaleTimeString("es-ES", {hour:"2-digit", minute:"2-digit"});
  if (d0.getTime() === yest.getTime()) return "Ayer · " + d.toLocaleTimeString("es-ES", {hour:"2-digit", minute:"2-digit"});
  return d.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "short" });
};

const ACTIVITY_ICONS = {
  Run: "🏃", TrailRun: "⛰", VirtualRun: "🏃",
  Ride: "🚴", VirtualRide: "🚴", MountainBikeRide: "🚵", GravelRide: "🚴", EBikeRide: "🚴",
  Swim: "🏊", Hike: "🥾", Walk: "🚶", Workout: "💪", WeightTraining: "🏋",
  Yoga: "🧘", Rowing: "🚣",
};
const iconFor = (t) => ACTIVITY_ICONS[t] || "🏅";
const isRun = (t) => /Run/.test(t || "");
const isRide = (t) => /Ride/.test(t || "");

/* ─────────────── Strava API ─────────────── */
const STRAVA = "https://www.strava.com/api/v3";

async function refreshStravaToken({ client_id, client_secret, refresh_token }) {
  const res = await fetch("https://www.strava.com/api/v3/oauth/token", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ client_id, client_secret, refresh_token, grant_type: "refresh_token" }),
  });
  if (!res.ok) throw new Error("No se pudo refrescar el token. Verifica client_id, client_secret y refresh_token.");
  return res.json();
}

async function stravaFetch(token, path, params = {}) {
  const url = new URL(STRAVA + path);
  Object.entries(params).forEach(([k, val]) => val != null && url.searchParams.set(k, val));
  const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
  if (res.status === 401) throw new Error("UNAUTHORIZED");
  if (res.status === 429) throw new Error("Has alcanzado el límite de peticiones de Strava. Espera 15 minutos.");
  if (!res.ok) throw new Error(`Strava ${res.status}`);
  return res.json();
}

async function fetchAllActivities(token, days = 90) {
  const after = Math.floor((Date.now() - days * 86400 * 1000) / 1000);
  const all = [];
  let page = 1;
  while (page <= 5) {
    const batch = await stravaFetch(token, "/athlete/activities",
      { after, per_page: 100, page });
    all.push(...batch);
    if (batch.length < 100) break;
    page++;
  }
  return all;
}

/* ─────────────── Training load math ─────────────── */
function activityLoad(a) {
  if (typeof a.suffer_score === "number" && a.suffer_score > 0) return a.suffer_score;
  if (a.average_heartrate) {
    const min = a.moving_time / 60;
    return Math.round(min * Math.pow(a.average_heartrate / 140, 2) * 1.5);
  }
  return Math.round((a.moving_time / 60) / 1.5);
}

function trainingLoadSeries(activities, days = 90) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const daily = new Array(days).fill(0);
  activities.forEach(a => {
    const d = new Date(a.start_date_local); d.setHours(0, 0, 0, 0);
    const idx = Math.floor((today - d) / 86400000);
    if (idx >= 0 && idx < days) daily[idx] += activityLoad(a);
  });
  const reversed = daily.slice().reverse();
  const ctlSeries = [], atlSeries = [], tsbSeries = [];
  let ctl = 0, atl = 0;
  const ctlA = 2 / (42 + 1), atlA = 2 / (7 + 1);
  for (let i = 0; i < reversed.length; i++) {
    ctl = reversed[i] * ctlA + ctl * (1 - ctlA);
    atl = reversed[i] * atlA + atl * (1 - atlA);
    ctlSeries.push(ctl); atlSeries.push(atl); tsbSeries.push(ctl - atl);
  }
  return {
    daily: reversed, ctl: ctlSeries, atl: atlSeries, tsb: tsbSeries,
    currentCTL: ctlSeries[ctlSeries.length - 1] || 0,
    currentATL: atlSeries[atlSeries.length - 1] || 0,
    currentTSB: tsbSeries[tsbSeries.length - 1] || 0,
  };
}

function hrZones(activities, maxHR) {
  const z = [0, 0, 0, 0, 0];
  activities.forEach(a => {
    if (!a.average_heartrate || !a.moving_time) return;
    const pct = a.average_heartrate / maxHR;
    let zi = 0;
    if (pct < 0.6) zi = 0;
    else if (pct < 0.7) zi = 1;
    else if (pct < 0.8) zi = 2;
    else if (pct < 0.9) zi = 3;
    else zi = 4;
    z[zi] += a.moving_time / 60;
  });
  return z;
}

function summarize(activities, days) {
  const cutoff = Date.now() - days * 86400000;
  const recent = activities.filter(a => new Date(a.start_date_local).getTime() >= cutoff);
  return {
    count: recent.length,
    distance: recent.reduce((s, a) => s + (a.distance || 0), 0),
    time: recent.reduce((s, a) => s + (a.moving_time || 0), 0),
    elevation: recent.reduce((s, a) => s + (a.total_elevation_gain || 0), 0),
    load: recent.reduce((s, a) => s + activityLoad(a), 0),
  };
}

/* ═══════════════ SETUP SCREEN ═══════════════ */
function Setup({ onConnect }) {
  const [mode, setMode] = useState("simple");
  const [token, setToken] = useState("");
  const [clientId, setClientId] = useState("");
  const [clientSecret, setClientSecret] = useState("");
  const [refreshToken, setRefreshToken] = useState("");
  const [aiKey, setAiKey] = useState(LS.get("ai_key") || "");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const submit = async () => {
    setError(""); setLoading(true);
    try {
      let accessToken = token.trim();
      let creds = null;
      if (mode === "refresh") {
        creds = {
          client_id: clientId.trim(),
          client_secret: clientSecret.trim(),
          refresh_token: refreshToken.trim(),
        };
        const tok = await refreshStravaToken(creds);
        accessToken = tok.access_token;
        creds.refresh_token = tok.refresh_token || refreshToken.trim();
      }
      if (!accessToken) throw new Error("Falta el access token");
      if (aiKey.trim()) LS.set("ai_key", aiKey.trim()); else LS.del("ai_key");
      onConnect({ accessToken, creds });
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", padding: "60px 20px 40px",
      minHeight: "100vh", display: "flex", flexDirection: "column" }}>

      <div className="pop-in" style={{ textAlign: "center", marginBottom: 36 }}>
        <div style={{
          width: 76, height: 76, margin: "0 auto 18px",
          background: `linear-gradient(135deg, ${v("systemOrange")}, ${v("systemRed")})`,
          borderRadius: 22,
          display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 38,
          boxShadow: "0 8px 24px rgba(255, 149, 0, 0.25)",
        }}>🏃</div>
        <h1 style={{ ...S.title1, color: v("label") }}>Trainer</h1>
        <p style={{ ...S.subhead, color: v("label-secondary"), marginTop: 6, maxWidth: 320, margin: "6px auto 0" }}>
          Tu entrenador personal con datos de Strava
        </p>
      </div>

      {/* Segmented control */}
      <div style={{
        display: "flex",
        background: v("fill-tertiary"),
        borderRadius: 9,
        padding: 2,
        marginBottom: 18,
      }}>
        {[{id:"simple", label:"Token"},{id:"refresh", label:"Auto-refresh"}].map(m => (
          <button key={m.id} onClick={() => setMode(m.id)}
            style={{
              flex: 1, padding: "8px 12px", borderRadius: 7,
              background: mode === m.id ? v("bg-grouped") : "transparent",
              color: v("label"),
              fontSize: 13, fontWeight: mode === m.id ? 600 : 500,
              letterSpacing: -0.08,
              boxShadow: mode === m.id ? "0 3px 8px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06)" : "none",
              transition: "all .2s",
            }}>
            {m.label}
          </button>
        ))}
      </div>

      <div style={S.card}>
        {mode === "simple" ? (
          <div style={{ padding: 4 }}>
            <Field>
              <input style={S.input} type="password" value={token}
                onChange={(e) => setToken(e.target.value)}
                placeholder="Access token de Strava" autoFocus/>
            </Field>
          </div>
        ) : (
          <div style={{ padding: 4 }}>
            <Field><input style={S.input} value={clientId}
              onChange={(e) => setClientId(e.target.value)} placeholder="Client ID"/></Field>
            <Separator/>
            <Field><input style={S.input} type="password" value={clientSecret}
              onChange={(e) => setClientSecret(e.target.value)} placeholder="Client Secret"/></Field>
            <Separator/>
            <Field><input style={S.input} type="password" value={refreshToken}
              onChange={(e) => setRefreshToken(e.target.value)} placeholder="Refresh Token"/></Field>
          </div>
        )}
      </div>

      <p style={{ ...S.footnote, color: v("label-secondary"), padding: "8px 16px 0", lineHeight: 1.4 }}>
        {mode === "simple"
          ? <>Obtén tu token en <a href="https://www.strava.com/settings/api" target="_blank" rel="noopener">strava.com/settings/api</a>. Expira en 6 horas; usa Auto-refresh para mantenerlo activo.</>
          : <>Obtén estos valores creando una app en <a href="https://www.strava.com/settings/api" target="_blank" rel="noopener">strava.com/settings/api</a>. Scope requerido: <code style={{fontFamily:"SF Mono, monospace"}}>activity:read_all</code>.</>
        }
      </p>

      <div style={{ ...S.sectionHeader, paddingLeft: 16 }}>Opcional · Coach IA</div>
      <div style={S.card}>
        <div style={{ padding: 4 }}>
          <Field>
            <input style={S.input} type="password" value={aiKey}
              onChange={(e) => setAiKey(e.target.value)}
              placeholder="Anthropic API Key"/>
          </Field>
        </div>
      </div>
      <p style={{ ...S.footnote, color: v("label-secondary"), padding: "8px 16px 0", lineHeight: 1.4 }}>
        Habilita feedback en lenguaje natural sobre tu entrenamiento.
      </p>

      {error && (
        <div style={{
          marginTop: 18, padding: "14px 16px",
          background: "rgba(255, 59, 48, 0.12)",
          color: v("systemRed"),
          borderRadius: 14, fontSize: 14, fontWeight: 500,
        }}>{error}</div>
      )}

      <div style={{ marginTop: 24 }}>
        <button onClick={submit} disabled={loading}
          style={{ ...S.primaryBtn, background: v("strava"),
            display: "flex", justifyContent: "center", alignItems: "center", gap: 10 }}>
          {loading ? <><span className="ios-spin">
            {[...Array(8)].map((_,i)=>(
              <div key={i} style={{transform:`rotate(${i*45}deg)`,
                animationDelay:`${-(8-i)*0.125}s`, background:"#fff"}}/>

          </span> Conectando</> : "Continuar"}
        </button>
      </div>

      <p style={{ ...S.caption, color: v("label-tertiary"), textAlign: "center",
        marginTop: 24, padding: "0 20px" }}>
        Tus credenciales nunca salen de este dispositivo.
      </p>
    </div>
  );
}

const Field = ({ children }) => (
  <div style={{ padding: "4px 4px" }}>{children}</div>
);
const Separator = () => (
  <div style={{ height: 1, background: v("separator"),
    marginLeft: 20 }}/>
);

/* ═══════════════ KPI CARD (Apple Fitness style) ═══════════════ */
function Metric({ label, value, unit, sub, gradient, icon }) {
  return (
    <div style={{
      ...S.card,
      flex: 1, minWidth: 145,
      padding: 16,
      background: gradient || v("bg-grouped"),
      color: gradient ? "#fff" : v("label"),
      position: "relative", overflow: "hidden",
    }}>
      {icon && <div style={{ fontSize: 16, marginBottom: 8, opacity: gradient ? .9 : 1 }}>{icon}</div>}
      <div style={{ fontSize: 12, fontWeight: 600, letterSpacing: -0.08,
        color: gradient ? "rgba(255,255,255,.85)" : v("label-secondary"),
        textTransform: "uppercase" }}>{label}</div>
      <div style={{ display: "flex", alignItems: "baseline", marginTop: 6, gap: 4 }}>
        <span style={{ fontSize: 28, fontWeight: 700, letterSpacing: -0.5,
          fontVariantNumeric: "tabular-nums" }}>{value}</span>
        {unit && <span style={{ fontSize: 14, fontWeight: 500,
          color: gradient ? "rgba(255,255,255,.85)" : v("label-secondary") }}>{unit}</span>}
      </div>
      {sub && <div style={{ fontSize: 13, fontWeight: 500,
        color: gradient ? "rgba(255,255,255,.8)" : v("label-secondary"),
        marginTop: 4, letterSpacing: -0.08 }}>{sub}</div>}
    </div>
  );
}

/* ═══════════════ DASHBOARD ═══════════════ */
function Dashboard({ athlete, activities }) {
  const s7 = useMemo(() => summarize(activities, 7), [activities]);
  const s28 = useMemo(() => summarize(activities, 28), [activities]);
  const greeting = () => {
    const h = new Date().getHours();
    if (h < 6) return "Buenas noches"; if (h < 12) return "Buenos días";
    if (h < 20) return "Buenas tardes"; return "Buenas noches";
  };

  return (
    <div className="pop-in">
      <div style={{ padding: "8px 4px 22px" }}>
        <div style={{ ...S.subhead, color: v("label-secondary") }}>{greeting()},</div>
        <h1 style={{ ...S.largeTitle, color: v("label"), marginTop: 2 }}>
          {athlete.firstname}
        </h1>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))",
        gap: 12, marginBottom: 28 }}>
        <Metric label="Esta semana" value={s7.count} unit="act."
          sub={`${fmtKm(s7.distance)} km · ${fmtMin(s7.time)}`}
          icon="📅"

/* ═══════════════ ANALYSIS ═══════════════ */
function Analysis({ athlete, activities }) {
  const load = useMemo(() => trainingLoadSeries(activities, 90), [activities]);
  const maxHR = athlete.max_heartrate || 220 - 35;
  const zones = useMemo(() => hrZones(activities, maxHR), [activities, maxHR]);
  const zoneTotal = zones.reduce((a, b) => a + b, 0) || 1;

  const tsb = load.currentTSB;
  const tsbState = tsb > 10
    ? { label: "Fresco", color: v("systemGreen"), advice: "Buen momento para una sesión de calidad o un test." }
    : tsb > -10
    ? { label: "Productivo", color: v("systemBlue"), advice: "Zona óptima. Mantén la carga actual." }
    : tsb > -25
    ? { label: "Fatigado", color: v("systemOrange"), advice: "Reduce intensidad. Considera un día más fácil." }
    : { label: "Sobrecargado", color: v("systemRed"), advice: "Necesitas recuperar. Descanso o sesión muy suave." };

  return (
    <div className="pop-in">
      <h1 style={{ ...S.title1, padding: "8px 4px 22px" }}>Análisis</h1>

      <div style={{ display: "grid",
        gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))",
        gap: 12, marginBottom: 28 }}>
        <Metric label="Forma (CTL)" value={load.currentCTL.toFixed(1)} sub="Carga 42d" icon="💪"/>
        <Metric label="Fatiga (ATL)" value={load.currentATL.toFixed(1)} sub="Carga 7d" icon="🔥"/>
        <Metric label="Frescura (TSB)" value={load.currentTSB.toFixed(1)} sub={tsbState.label}
          gradient={`linear-gradient(135deg, ${tsbState.color}, ${tsbState.color}cc)`} icon="✨"/>
      </div>

      <div style={{ ...S.sectionHeader, paddingLeft: 4 }}>Carga 90 días</div>
      <div style={{ ...S.card, padding: 20 }}>
        <LoadChart load={load}/>
        <div style={{
          marginTop: 16, padding: "12px 14px",
          borderRadius: 10,
          background: `${tsbState.color}15`,
          color: tsbState.color,
          fontSize: 14, fontWeight: 500, lineHeight: 1.4,
        }}>
          <b>{tsbState.label}.</b> <span style={{ color: v("label") }}>{tsbState.advice}</span>
        </div>
      </div>

      <div style={{ ...S.sectionHeader, paddingLeft: 4 }}>Zonas de frecuencia cardíaca</div>
      <div style={{ ...S.card, padding: 20 }}>
        <div style={{ ...S.footnote, color: v("label-secondary"), marginBottom: 14 }}>
          FC máxima estimada: <b style={{ color: v("label") }}>{maxHR} bpm</b>
        </div>
        {["Recuperación", "Aeróbico", "Tempo", "Umbral", "VO₂max"].map((label, i) => {
          const pct = (zones[i] / zoneTotal) * 100;
          const colors = [v("systemGray"), v("systemBlue"), v("systemGreen"),
            v("systemOrange"), v("systemRed")];
          return (
            <div key={i} style={{ marginBottom: i < 4 ? 14 : 0 }}>

                  {Math.round(zones[i])} min · {pct.toFixed(0)}%
                </span>

            </div>
          );

      </div>
    </div>
  );
}

function LoadChart({ load }) {
  const W = 700, H = 200, P = 24;
  const n = load.ctl.length;
  const allVals = [...load.ctl, ...load.atl, ...load.daily];
  const max = Math.max(...allVals, 50);
  const x = (i) => P + (i / (n - 1)) * (W - 2 * P);
  const y = (val) => H - P - (val / max) * (H - 2 * P);

  const linePath = (arr) => arr.map((val, i) => `${i ? "L" : "M"}${x(i)},${y(val)}`).join(" ");
  const areaPath = (arr) =>
    `M${x(0)},${H-P} L${arr.map((val, i) => `${x(i)},${y(val)}`).join(" L")} L${x(n-1)},${H-P} Z`;

  return (
    <div style={{ overflowX: "auto" }}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", maxWidth: W, height: "auto" }}>
        <defs>
          <linearGradient id="ctlGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#007AFF" stopOpacity="0.3"/>
            <stop offset="100%" stopColor="#007AFF" stopOpacity="0"/>
          </linearGradient>
          <linearGradient id="atlGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#FF9500" stopOpacity="0.25"/>
            <stop offset="100%" stopColor="#FF9500" stopOpacity="0"/>
          </linearGradient>
        </defs>
        {/* Daily load bars */}
        {load.daily.map((val, i) => val > 0 && (
          <rect key={i} x={x(i) - 1.5} y={y(val)} width={3} height={H - P - y(val)}
            fill="#8E8E93" opacity={.35} rx={1.5}/>
        ))}
        {/* CTL area + line */}
        <path d={areaPath(load.ctl)} fill="url(#ctlGrad)"/>
        <path d={linePath(load.ctl)} stroke="#007AFF" fill="none"
          strokeWidth={2.5} strokeLinecap="round" strokeLinejoin="round"/>
        {/* ATL */}
        <path d={linePath(load.atl)} stroke="#FF9500" fill="none"
          strokeWidth={2.5} strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
      <div style={{ display: "flex", gap: 18, ...S.footnote, marginTop: 8, flexWrap: "wrap" }}>
        <span style={{ display:"flex", alignItems:"center", gap:6 }}>
          <span style={{ width:10, height:3, background: v("systemBlue"), borderRadius: 2 }}/>
          <span style={{ color: v("label-secondary") }}>Forma</span>
        </span>
        <span style={{ display:"flex", alignItems:"center", gap:6 }}>
          <span style={{ width:10, height:3, background: v("systemOrange"), borderRadius: 2 }}/>
          <span style={{ color: v("label-secondary") }}>Fatiga</span>
        </span>
        <span style={{ display:"flex", alignItems:"center", gap:6 }}>
          <span style={{ width:3, height:8, background: v("systemGray"), opacity: .5 }}/>
          <span style={{ color: v("label-secondary") }}>Carga diaria</span>
        </span>
      </div>
    </div>
  );
}

/* ═══════════════ AI COACH ═══════════════ */
async function askClaude(apiKey, prompt, system) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1024,
      system,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error(`Claude API ${res.status}: ${text.slice(0, 200)}`);
  }
  const data = await res.json();
  return data.content?.[0]?.text || "(Sin respuesta)";
}

function buildCoachContext(athlete, activities) {
  const load = trainingLoadSeries(activities, 90);
  const s7 = summarize(activities, 7);
  const s28 = summarize(activities, 28);
  const recent = activities.slice(0, 10).map(a => ({
    date: a.start_date_local.slice(0, 10),
    type: a.type,
    name: a.name,
    distance_km: +(a.distance / 1000).toFixed(2),
    duration_min: Math.round(a.moving_time / 60),
    avg_hr: a.average_heartrate ? Math.round(a.average_heartrate) : null,
    avg_pace_min_per_km: isRun(a.type) && a.average_speed ?
      +(1000 / a.average_speed / 60).toFixed(2) : null,
    avg_speed_kmh: !isRun(a.type) && a.average_speed ?
      +(a.average_speed * 3.6).toFixed(1) : null,
    elevation_gain_m: Math.round(a.total_elevation_gain || 0),
    suffer_score: a.suffer_score || null,
  }));
  return {
    athlete: { name: athlete.firstname, sex: athlete.sex, ftp: athlete.ftp },
    training_load: {
      ctl: +load.currentCTL.toFixed(1),
      atl: +load.currentATL.toFixed(1),
      tsb: +load.currentTSB.toFixed(1),
    },
    last_7d: { activities: s7.count, distance_km: +(s7.distance/1000).toFixed(1),
      moving_hours: +(s7.time/3600).toFixed(1), elevation_m: Math.round(s7.elevation) },
    last_28d: { activities: s28.count, distance_km: +(s28.distance/1000).toFixed(1),
      moving_hours: +(s28.time/3600).toFixed(1), elevation_m: Math.round(s28.elevation) },
    recent_activities: recent,
  };
}

  const [loading, setLoading] = useState(false);

  const scrollRef = useRef(null);

  useEffect(() => {
    scrollRef.current?.scrollTo({ top: scrollRef.current.scrollHeight, behavior: "smooth" });
  }, [messages, loading]);

  const ctx = useMemo(() => buildCoachContext(athlete, activities), [athlete, activities]);
  const system = `Eres un entrenador personal de running/ciclismo profesional, cercano y conciso.
Habla en español usando "tú". Da consejos accionables basados en los datos del atleta.
No inventes datos. Si te falta info, pídela. Sé directo, evita rodeos. Usa Markdown ligero si ayuda.

${JSON.stringify(ctx, null, 2)}`;

    setError("");
    setMessages(m => [...m, { role: "user", content: q }]);

    try {

      setError(e.message);

              }}>🤖</div>
              <div style={{ ...S.headline, marginBottom: 6 }}>Tu coach personal</div>
              <div style={{ ...S.footnote, color: v("label-secondary"), maxWidth: 280, margin: "0 auto 18px" }}>
                Conoce tus últimas actividades, tu carga y tu frescura.
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8, justifyContent: "center" }}>
                {presets.map(p => (
                  <button key={p} onClick={() => send(p)}
                    style={{
                      padding: "9px 14px", borderRadius: 18,
                      background: v("fill-tertiary"),
                      color: v("label"),
                      fontSize: 14, fontWeight: 500, letterSpacing: -0.2,
                    }}>{p}</button>
                ))}
              </div>
            </div>
          )}
          {messages.map((m, i) => (
            <div key={i} style={{ marginBottom: 12, display: "flex",
              justifyContent: m.role === "user" ? "flex-end" : "flex-start" }}>
              <div style={{
                maxWidth: "82%",
                padding: "10px 14px",
                borderRadius: 18,
                background: m.role === "user" ? v("systemBlue") : v("fill-tertiary"),
                color: m.role === "user" ? "#fff" : v("label"),
                fontSize: 15, lineHeight: 1.42, whiteSpace: "pre-wrap",
                letterSpacing: -0.24,
              }}>{m.content}</div>
            </div>
          ))}
          {loading && (
            <div style={{ display: "flex", marginBottom: 12 }}>
              <div style={{
                padding: "12px 16px", borderRadius: 18,
                background: v("fill-tertiary"),
                display: "flex", gap: 4, alignItems: "center",
              }}>
                {[0,1,2].map(i => (
                  <span key={i} style={{
                    width: 7, height: 7, borderRadius: 5,
                    background: v("label-tertiary"),
                    animation: `ios-fade 1.4s ${i * 0.2}s infinite`,
                  }}/>
                ))}
              </div>
            </div>
          )}
        </div>

        {error && (
          <div style={{
            margin: "0 18px 12px", padding: "10px 14px",
            background: `${v("systemRed")}18`, color: v("systemRed"),
            borderRadius: 10, ...S.footnote, fontWeight: 500,
          }}>{error}</div>
        )}

        <div style={{
          padding: 14, borderTop: `0.5px solid ${v("separator")}`,
          display: "flex", gap: 10, alignItems: "center",
        }}>
          <input style={{
            ...S.input,
            background: v("bg"),
            borderRadius: 18,
            padding: "10px 16px",
            fontSize: 15,
          }} value={input}
            onChange={(e) => setInput(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && send()}
            placeholder="Mensaje"/>
          <button onClick={() => send()} disabled={loading || !input.trim()}
            style={{
              width: 38, height: 38, borderRadius: 19,
              background: v("systemBlue"),
              color: "#fff", fontSize: 18, fontWeight: 700,
              display: "flex", alignItems: "center", justifyContent: "center",
              flexShrink: 0,
            }}>↑</button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════ SETTINGS SHEET ═══════════════ */
function SettingsSheet({ aiKey, onSaveAiKey, onDisconnect, onClose }) {
  const [key, setKey] = useState(aiKey || "");
  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,.45)",
      zIndex: 50,
      display: "flex", alignItems: "flex-end", justifyContent: "center",
      backdropFilter: "blur(4px)", WebkitBackdropFilter: "blur(4px)",
    }} onClick={onClose}>
      <div className="sheet" onClick={(e) => e.stopPropagation()}
        style={{
          background: v("bg"),
          width: "100%", maxWidth: 500,
          borderTopLeftRadius: 20, borderTopRightRadius: 20,
          padding: "8px 20px 30px",
          paddingBottom: "calc(30px + env(safe-area-inset-bottom))",
        }}>
        <div style={{
          width: 36, height: 5, background: v("label-quaternary"),
          borderRadius: 3, margin: "8px auto 18px",
        }}/>
        <h2 style={{ ...S.title2, marginBottom: 18 }}>Ajustes</h2>

        <div style={{ ...S.sectionHeader, paddingLeft: 0, paddingTop: 0 }}>Coach IA</div>
        <div style={S.card}>
          <div style={{ padding: 4 }}>
            <Field>
              <input style={S.input} type="password" value={key}
                onChange={(e) => setKey(e.target.value)}
                placeholder="Anthropic API Key"/>
            </Field>
          </div>
        </div>
        <p style={{ ...S.footnote, color: v("label-secondary"), padding: "8px 4px 0" }}>
          Necesaria para el Coach IA. Se guarda en este dispositivo.
        </p>

        <div style={{ display: "flex", gap: 10, marginTop: 24 }}>
          <button onClick={onClose} style={{ ...S.secondaryBtn, flex: 1 }}>Cancelar</button>
          <button onClick={() => { onSaveAiKey(key.trim()); onClose(); }}
            style={{ ...S.primaryBtn, flex: 1 }}>Guardar</button>
        </div>

        <button onClick={onDisconnect}
          style={{ ...S.destructiveBtn, width: "100%", marginTop: 14 }}>
          Desconectar de Strava
        </button>
      </div>
    </div>
  );
}

/* ═══════════════ APP ═══════════════ */
function App() {
  const [creds, setCreds] = useState(() => LS.get("strava_creds"));
  const [token, setToken] = useState(() => LS.get("strava_token"));
  const [tokenExpiresAt, setTokenExpiresAt] = useState(() => LS.get("strava_token_expires_at"));
  const [aiKey, setAiKey] = useState(() => LS.get("ai_key") || "");
  const [athlete, setAthlete] = useState(null);
  const [activities, setActivities] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [tab, setTab] = useState("dashboard");
  const [showSettings, setShowSettings] = useState(false);

  const ensureToken = async () => {
    if (creds && tokenExpiresAt && Date.now() > (tokenExpiresAt - 60) * 1000) {
      const tok = await refreshStravaToken(creds);
      LS.set("strava_token", tok.access_token);
      LS.set("strava_token_expires_at", tok.expires_at);
      LS.set("strava_creds", { ...creds, refresh_token: tok.refresh_token });
      setToken(tok.access_token);
      setTokenExpiresAt(tok.expires_at);
      setCreds({ ...creds, refresh_token: tok.refresh_token });
      return tok.access_token;
    }
    return token;
  };

  const loadData = async (tok) => {
    setLoading(true); setError("");
    try {
      const t = tok || await ensureToken();
      const [me, acts] = await Promise.all([
        stravaFetch(t, "/athlete"),
        fetchAllActivities(t, 90),
      ]);
      setAthlete(me);
      setActivities(acts);
      LS.set("strava_activities", { ts: Date.now(), data: acts });
      LS.set("strava_athlete", me);
    } catch (e) {
      if (e.message === "UNAUTHORIZED") {
        setError("Token expirado o inválido. Vuelve a conectar.");
        handleDisconnect();
      } else {
        setError(e.message);
      }
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => {
    if (token) {
      const cachedAth = LS.get("strava_athlete");
      const cachedAct = LS.get("strava_activities");
      if (cachedAth) setAthlete(cachedAth);
      if (cachedAct && Date.now() - cachedAct.ts < 10 * 60 * 1000) {
        setActivities(cachedAct.data);
      } else {
        loadData(token);
      }
    }
  }, []);

  const handleConnect = async ({ accessToken, creds: newCreds }) => {
    LS.set("strava_token", accessToken);
    setToken(accessToken);
    if (newCreds) {
      LS.set("strava_creds", newCreds);
      setCreds(newCreds);
    }
    setAiKey(LS.get("ai_key") || "");
    await loadData(accessToken);
  };

  const handleDisconnect = () => {
    LS.del("strava_token"); LS.del("strava_creds"); LS.del("strava_token_expires_at");
    LS.del("strava_activities"); LS.del("strava_athlete");
    setToken(null); setCreds(null); setAthlete(null); setActivities([]);
    setShowSettings(false);
  };

  if (!token) return <Setup onConnect={handleConnect}/>;
  if (!athlete && loading) {
    return (
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center",
        minHeight: "100vh", flexDirection: "column", gap: 14 }}>
        <span className="ios-spin">
          {[...Array(8)].map((_,i)=>(
            <div key={i} style={{transform:`rotate(${i*45}deg)`,
              animationDelay:`${-(8-i)*0.125}s`}}/>
          ))}
        </span>
        <div style={{ ...S.subhead, color: v("label-secondary") }}>Cargando…</div>
      </div>
    );
  }
  if (!athlete) {
    return (
      <div style={{ padding: 40, textAlign: "center", maxWidth: 400, margin: "0 auto" }}>
        <div style={{ fontSize: 40, marginBottom: 10 }}>⚠️</div>
        <p style={{ ...S.body, marginBottom: 20 }}>{error || "Error desconocido"}</p>
        <button onClick={() => loadData()} style={S.primaryBtn}>Reintentar</button>
        <button onClick={handleDisconnect}
          style={{ ...S.destructiveBtn, marginTop: 10, width: "100%" }}>Desconectar</button>
      </div>
    );
  }

  const tabs = [
    { id: "dashboard", label: "Inicio", icon: "🏠" },
    { id: "analysis", label: "Análisis", icon: "📈" },
    { id: "plan", label: "Plan", icon: "🎯" },
    { id: "coach", label: "Coach", icon: "🤖" },
  ];

  return (
    <div style={{ minHeight: "100vh", paddingBottom: 90 }}>
      {/* Top nav bar (iOS style) */}
      <header className="glass" style={{
        position: "sticky", top: 0, zIndex: 20,
        padding: "12px 20px",
        display: "flex", alignItems: "center", justifyContent: "space-between",
        borderBottom: `0.5px solid ${v("separator")}`,
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{
            width: 28, height: 28, borderRadius: 8,
            background: `linear-gradient(135deg, ${v("systemOrange")}, ${v("systemRed")})`,
            display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 16,
          }}>🏃</div>
          <div style={{ ...S.headline }}>Trainer</div>
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          <button onClick={() => loadData()} disabled={loading}
            style={{
              width: 38, height: 38, borderRadius: 19,
              background: v("fill-tertiary"),
              display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: 16, color: v("systemBlue"),
            }}>
            {loading ? <span className="ios-spin" style={{ width:14, height:14 }}>
              {[...Array(8)].map((_,i)=>(
                <div key={i} style={{
                  width:1.5, height:4,
                  transform:`rotate(${i*45}deg)`,
                  animationDelay:`${-(8-i)*0.125}s`,
                  transformOrigin: "0.75px 7px",
                }}/>
              ))}
            </span> : "↻"}
          </button>
          <button onClick={() => setShowSettings(true)}
            style={{
              width: 38, height: 38, borderRadius: 19,
              background: v("fill-tertiary"),
              display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: 18,
            }}>⚙</button>
        </div>
      </header>

      {/* Main content */}
      <main style={{ maxWidth: 720, margin: "0 auto", padding: "20px 16px" }}>
        {error && (
          <div style={{
            marginBottom: 16, padding: "12px 16px",
            background: `${v("systemRed")}15`,
            color: v("systemRed"),
            borderRadius: 12, ...S.footnote, fontWeight: 500,
          }}>{error}</div>
        )}
        {tab === "dashboard" && <Dashboard athlete={athlete} activities={activities}/>}
        {tab === "analysis" && <Analysis athlete={athlete} activities={activities}/>}
        {tab === "plan" && <Plan athlete={athlete} activities={activities}/>}
        {tab === "coach" && <Coach athlete={athlete} activities={activities} aiKey={aiKey}/>}
      </main>

      {/* iOS-style Tab Bar */}
      <nav className="glass" style={{
        position: "fixed", bottom: 0, left: 0, right: 0,
        borderTop: `0.5px solid ${v("separator")}`,
        padding: "8px 0 calc(8px + env(safe-area-inset-bottom))",
        display: "flex", justifyContent: "space-around",
        zIndex: 20,
      }}>
        {tabs.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)}
            style={{
              flex: 1, maxWidth: 100,
              padding: "6px 0",
              display: "flex", flexDirection: "column", alignItems: "center", gap: 3,
              color: tab === t.id ? v("strava") : v("label-secondary"),
              fontSize: 22, lineHeight: 1,
            }}>
            <span style={{ filter: tab === t.id ? "none" : "grayscale(0.4)",
              opacity: tab === t.id ? 1 : .7 }}>{t.icon}</span>
            <span style={{
              fontSize: 10, fontWeight: tab === t.id ? 700 : 500,
              letterSpacing: -0.08,
            }}>{t.label}</span>
          </button>
        ))}
      </nav>

      {showSettings && (
        <SettingsSheet aiKey={aiKey}
          onSaveAiKey={(k) => { setAiKey(k); if (k) LS.set("ai_key", k); else LS.del("ai_key"); }}
          onDisconnect={handleDisconnect}
          onClose={() => setShowSettings(false)}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
