/* ── App ── */
function App(){
  const[lang,setLang]=useState("es");
  const t=T[lang],al=AXIS_LABEL[lang];
  const[step,setStep]=useState("setup");
  const[role,setRole]=useState(null);
  const[selBUs,setSelBUs]=useState([]);
  const[selfDes,setSelfDes]=useState({});
  const[manDes,setManDes]=useState({});
  const[buIdx,setBuIdx]=useState(0);
  const[qId,setQId]=useState(null);
  const[scores,setScores]=useState({});
  const[answered,setAnswered]=useState(0);

  const curBU=selBUs[buIdx];
  const qMap=curBU?buildQMap(curBU):{};
  const curQ=qId?qMap[qId]:null;
  const totalQ=selBUs.reduce((a,bu)=>(TREES[bu]?.subs||[]).reduce((b,s)=>b+s.qs.length,a),0);

  const initDesired=(bus,r)=>{const sd={},md={};bus.forEach(bu=>(TREES[bu]?.subs||[]).forEach(s=>{const c=getCeiling(s.id,r);sd[s.id]=c;md[s.id]=c;}));setSelfDes(sd);setManDes(md);};
  const toggleBU=id=>{const next=selBUs.includes(id)?selBUs.filter(b=>b!==id):[...selBUs,id];setSelBUs(next);if(role)initDesired(next,role);};
  const selectRole=r=>{setRole(r);if(selBUs.length)initDesired(selBUs,r);};
  const startAssess=()=>{setBuIdx(0);setQId(firstQ(selBUs[0]));setScores({});setAnswered(0);setStep("assess");};
  const recScore=(bu,sdId,sc)=>setScores(p=>{const k=`${bu}_${sdId}`;return{...p,[k]:Math.max(p[k]||0,sc)};});
  const answer=yes=>{
    if(!curQ)return;
    setAnswered(c=>c+1);
    recScore(curBU,curQ.sdId,yes?(curQ.ysc??curQ.lv):curQ.nsc);
    if(!yes||!curQ.yes){const nf=nextSdFirst(curBU,curQ.sdId);if(nf)setQId(nf);else if(buIdx+1<selBUs.length){const ni=buIdx+1;setBuIdx(ni);setQId(firstQ(selBUs[ni]));}else setStep("results");}
    else setQId(curQ.yes);
  };
  const restart=()=>{setStep("setup");setRole(null);setSelBUs([]);setSelfDes({});setManDes({});setBuIdx(0);setQId(null);setScores({});setAnswered(0);};

  const compute=()=>{
    const buRes={};selBUs.forEach(bu=>{const subs=TREES[bu]?.subs||[];let tot=0,cnt=0;subs.forEach(sd=>{tot+=(scores[`${bu}_${sd.id}`]||0);cnt++;});buRes[bu]=cnt?tot/cnt:0;});
    const axBuckets={};AXES.forEach(ax=>{axBuckets[ax]=[];});
    selBUs.forEach(bu=>{(TREES[bu]?.subs||[]).forEach(sd=>{const sdScore=scores[`${bu}_${sd.id}`]||0;sd.qs.forEach(q=>{if(q.lv<=sdScore&&axBuckets[q.axis])axBuckets[q.axis].push(sdScore);});if(sdScore===0)sd.qs.filter(q=>q.lv===1).forEach(q=>{if(axBuckets[q.axis])axBuckets[q.axis].push(0);});});});
    const axRes={};AXES.forEach(ax=>{const arr=axBuckets[ax];axRes[ax]=arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;});
    const overallAct=selBUs.length?Object.values(buRes).reduce((a,b)=>a+b,0)/selBUs.length:0;
    const allSubsList=selBUs.flatMap(bu=>TREES[bu]?.subs||[]);
    const selfAxes={},manAxes={};
    AXES.forEach(ax=>{selfAxes[ax]=allSubsList.reduce((a,s)=>a+(selfDes[s.id]||getCeiling(s.id,role)),0)/(allSubsList.length||1);manAxes[ax]=allSubsList.reduce((a,s)=>a+(manDes[s.id]||getCeiling(s.id,role)),0)/(allSubsList.length||1);});
    const overallSelf=allSubsList.length?allSubsList.reduce((a,s)=>a+(selfDes[s.id]||getCeiling(s.id,role)),0)/allSubsList.length:3;
    const overallMan=allSubsList.length?allSubsList.reduce((a,s)=>a+(manDes[s.id]||getCeiling(s.id,role)),0)/allSubsList.length:3;
    return{buRes,axRes,overallAct,selfAxes,manAxes,overallSelf,overallMan};
  };
  const{buRes={},axRes={},overallAct=0,selfAxes={},manAxes={},overallSelf=0,overallMan=0}=step==="results"?compute():{};
  const profAct=step==="results"?profileFor(overallAct):null;
